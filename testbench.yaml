laravel: '@testbench'

providers:
  - ExploreOrg\Sqids\SqidsServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/'
  install: true
  discovers:
    web: true
    api: false
    commands: false
    components: false
    factories: true
    views: false
  build:
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets: [ ]
  sync: [ ]

